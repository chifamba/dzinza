apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-moderation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-moderation-service
  template:
    metadata:
      labels:
        app: admin-moderation-service
    spec:
      containers:
      - name: admin-moderation-service
        image: dzinza/admin-moderation-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "postgres"
        - name: REDIS_HOST
          value: "redis"
---
apiVersion: v1
kind: Service
metadata:
  name: admin-moderation-service
spec:
  selector:
    app: admin-moderation-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
