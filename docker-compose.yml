# Dzinza Genealogy Platform - Docker Compose Configuration
# Complete development and production environment setup

# Define global secrets - in a real setup, these would point to files or be managed by an orchestrator
secrets:
  db_password:
    file: ./secrets/db_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  elasticsearch_password:
    file: ./secrets/elasticsearch_password.txt # If used
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  api_key_general: # Renamed to avoid conflict if other API keys are service specific
    file: ./secrets/api_key_general.txt
  aws_access_key_id:
    file: ./secrets/aws_access_key_id.txt
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
  google_client_id:
    file: ./secrets/google_client_id.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  minio_access_key:
    file: ./secrets/minio_access_key.txt
  minio_secret_key:
    file: ./secrets/minio_secret_key.txt
  # Add other external API key secrets here as needed
  # Example:
  # openai_api_key:
  #   file: ./secrets/openai_api_key.txt
  seed_admin_password:
    file: ./secrets/seed_admin_password.txt

services:
  # Base image for Python services (not a runnable service itself, but context for builds)
  # This entry is more for reference; actual services will use this context.
  # python_base:
  #   build:
  #     context: ./base
  #     dockerfile: Dockerfile


  # PostgreSQL Database
  postgres:
    image: postgres:17.8-alpine
    container_name: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-dzinza_db}
      - POSTGRES_USER=${DB_USER:-dzinza_user}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password # Use secret file
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    secrets: # Grant access to the secret
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - dzinza-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-dzinza_user} -d ${DB_NAME:-dzinza_db}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB for Genealogy Data
  mongodb:
    image: mongo:8.0-noble  # No alpine variant available for MongoDB
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER:-dzinza_user}
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_password # Use secret file
      - MONGO_INITDB_DATABASE=${MONGODB_GENEALOGY_DB:-dzinza_genealogy}
    secrets: # Grant access to the secret
      - mongo_password
    volumes:
      - mongodb_data:/data/db
      - ./database/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - dzinza-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Neo4j Graph Database for Genealogy
  neo4j:
    image: neo4j:2026.01.4
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/testpassword
      - NEO4J_PLUGINS=["apoc"]
    networks:
      - dzinza-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider --timeout=1 http://localhost:7474 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache & Session Store
  redis:
    image: redis:8.6.0-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["sh", "-c", "redis-server --requirepass $(cat /run/secrets/redis_password)"]
    secrets: # Grant access to the secret
      - redis_password
    volumes:
      - redis_data:/data
    # Environment variable for REDIS_PASSWORD is no longer needed if accessed via file by the application
    # If the application itself needs REDIS_PASSWORD env var, it should read it from /run/secrets/redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $(cat /run/secrets/redis_password) ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MailHog for Email Testing
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - dzinza-network
    restart: unless-stopped

  # Elasticsearch for Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "cluster.name=dzinza-elasticsearch"
      - "http.cors.enabled=true"
      - 'http.cors.allow-origin="*"'
      - "indices.recovery.max_bytes_per_sec=100mb"
      - "action.destructive_requires_name=false"
      - "logger.level=INFO"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - dzinza-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    networks:
      - dzinza-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:12.3.3
    container_name: grafana
    ports:
      - "3300:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password # Use secret file
    secrets: # Grant access to the secret
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - dzinza-network
    restart: unless-stopped

  # Garage S3-compatible Service
  garage1:
    image: dxflrs/garage:v2.2.0
    container_name: dzinza-garage1
    hostname: garage1
    ports:
      - "39000:39000" # S3 API
      - "39011:39011" # RPC
      - "39021:39021" # Web admin
    volumes:
      - ./garage/garage1.toml:/etc/garage.toml
      - garage1_data:/var/lib/garage/data1
      - garage1_meta:/var/lib/garage/meta1
    networks:
      - dzinza-network
    restart: unless-stopped

  garage2:
    image: dxflrs/garage:v2.2.0
    container_name: dzinza-garage2
    hostname: garage2
    ports:
      - "39002:39002" # S3 API
      - "39012:39012" # RPC
      - "39022:39022" # Web admin
    volumes:
      - ./garage/garage2.toml:/etc/garage.toml
      - garage2_data:/var/lib/garage/data2
      - garage2_meta:/var/lib/garage/meta2
    networks:
      - dzinza-network
    restart: unless-stopped

  garage3:
    image: dxflrs/garage:v2.2.0
    container_name: dzinza-garage3
    hostname: garage3
    ports:
      - "39003:39003" # S3 API
      - "39013:39013" # RPC
      - "39023:39023" # Web admin
    volumes:
      - ./garage/garage3.toml:/etc/garage.toml
      - garage3_data:/var/lib/garage/data3
      - garage3_meta:/var/lib/garage/meta3
    networks:
      - dzinza-network
    restart: unless-stopped

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      - auth_service

  # ============================================================
  # APPLICATION SERVICES (Go)
  # ============================================================
  # Go microservices will be added here as they are implemented.
  # Each service will use a multi-stage Dockerfile:
  #   Build stage: golang:1.26-alpine
  #   Runtime stage: alpine:3.19 (or scratch)

  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: auth_service
    ports:
      - "8003:8003"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_PORT=8003
    secrets:
      - db_password
      - jwt_secret
      - jwt_refresh_secret
      - redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  genealogy_service:
    build:
      context: .
      dockerfile: services/genealogy_service/Dockerfile
    container_name: genealogy_service
    ports:
      - "8006:8006"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword
      - GENEALOGY_SERVICE_PORT=8006
      - INTEGRATION_SERVICE_URL=http://integration_service:8017
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    secrets:
      - jwt_secret
      - redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media_storage_service:
    build:
      context: .
      dockerfile: services/media_storage_service/Dockerfile
    container_name: media_storage_service
    ports:
      - "8009:8009"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://garage1:39000
      - S3_BUCKET=dzinza-media
      - MEDIA_STORAGE_SERVICE_PORT=8009
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - CDN_BASE_URL=http://localhost:8009/api/v1/media/content # For local dev, point back to service or a CDN emulator
    secrets:
      - db_password
      - jwt_secret
      - aws_access_key_id
      - aws_secret_access_key
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage1:
        condition: service_started

  notification_service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    container_name: notification_service
    ports:
      - "8010:8010"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - NOTIFICATION_SERVICE_PORT=8010
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    secrets:
      - db_password
      - jwt_secret
      - redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy

  search_discovery_service:
    build:
      context: .
      dockerfile: services/search_discovery_service/Dockerfile
    container_name: search_discovery_service
    ports:
      - "8012:8012"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword
      - SEARCH_SERVICE_PORT=8012
    secrets:
      - redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  audit_history_service:
    build:
      context: .
      dockerfile: services/audit_history_service/Dockerfile
    container_name: audit_history_service
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - AUDIT_HISTORY_SERVICE_PORT=8002
    secrets:
      - db_password
      - jwt_secret
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  trust_access_control_service:
    build:
      context: .
      dockerfile: services/trust_access_control_service/Dockerfile
    container_name: trust_access_control_service
    ports:
      - "8013:8013"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRUST_SERVICE_PORT=8013
    secrets:
      - redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  relationship_verification_service:
    build:
      context: .
      dockerfile: services/relationship_verification_service/Dockerfile
    container_name: relationship_verification_service
    ports:
      - "8011:8011"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - VERIFICATION_SERVICE_PORT=8011
    secrets:
      - db_password
      - jwt_secret
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  deduplication_service:
    build:
      context: .
      dockerfile: services/deduplication_service/Dockerfile
    container_name: deduplication_service
    ports:
      - "8005:8005"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword
      - DEDUPLICATION_SERVICE_PORT=8005
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy

  admin_moderation_service:
    build:
      context: .
      dockerfile: services/admin_moderation_service/Dockerfile
    container_name: admin_moderation_service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_SERVICE_PORT=8000
    secrets:
      - db_password
      - jwt_secret
      - redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  graph_query_service:
    build:
      context: .
      dockerfile: services/graph_query_service/Dockerfile
    container_name: graph_query_service
    ports:
      - "8007:8007"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword
      - GRAPH_QUERY_SERVICE_PORT=8007
    secrets:
      - jwt_secret
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy

  analytics_service:
    build:
      context: .
      dockerfile: services/analytics_service/Dockerfile
    container_name: analytics_service
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANALYTICS_SERVICE_PORT=8001
    secrets:
      - db_password
      - redis_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  community_marketplace_service:
    build:
      context: .
      dockerfile: services/community_marketplace_service/Dockerfile
    container_name: community_marketplace_service
    ports:
      - "8004:8004"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - MARKETPLACE_SERVICE_PORT=8004
    secrets:
      - db_password
      - jwt_secret
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  localization_service:
    build:
      context: .
      dockerfile: services/localization_service/Dockerfile
    container_name: localization_service
    ports:
      - "8008:8008"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-dzinza_db}
      - DB_USER=${DB_USER:-dzinza_user}
      - LOCALIZATION_SERVICE_PORT=8008
    secrets:
      - db_password
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  help_support_service:
    build:
      context: .
      dockerfile: services/help_support_service/Dockerfile
    container_name: help_support_service
    ports:
      - "8014:8014"
    environment:
      - MONGO_URI=mongodb://dzinza_user:testpassword@mongodb:27017
      - HELP_SERVICE_PORT=8014
    secrets:
      - jwt_secret
    networks:
      - dzinza-network
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

  ai_moderation_service:
    build:
      context: .
      dockerfile: services/ai_moderation_service/Dockerfile
    container_name: ai_moderation_service
    ports:
      - "8015:8015"
    environment:
      - AI_SERVICE_PORT=8015
    networks:
      - dzinza-network
    restart: unless-stopped

  backup_recovery_service:
    build:
      context: .
      dockerfile: services/backup_recovery_service/Dockerfile
    container_name: backup_recovery_service
    ports:
      - "8016:8016"
    environment:
      - BACKUP_SERVICE_PORT=8016
    networks:
      - dzinza-network
    restart: unless-stopped

  integration_service:
    build:
      context: .
      dockerfile: services/integration_service/Dockerfile
    container_name: integration_service
    ports:
      - "8017:8017"
    environment:
      - INTEGRATION_SERVICE_PORT=8017
    networks:
      - dzinza-network
    restart: unless-stopped

  # Define named volumes
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  shared_config: # Define the shared_config volume
  garage1_data:
  garage1_meta:
  garage2_data:
  garage2_meta:
  garage3_data:
  garage3_meta:
  neo4j_data:
  neo4j_logs:

networks:
  dzinza-network:
    driver: bridge # Default network driver, can be customized if needed
