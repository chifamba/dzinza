# Dzinza v2 — private genealogy research tool.
# Two containers: Neo4j (graph DB) + API (serves the React frontend).
#   docker compose up -d        # start
#   docker compose down         # stop (data persists in named volumes)
#
# First run: set ADMIN_PASSWORD (or DZINZA_DEV=1 for local dev).
# Data lives in the neo4j-data and dzinza-media volumes; see scripts/backup.sh.

services:
  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-dzinza-dev-password}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "127.0.0.1:7474:7474"   # browser UI (localhost only)
      - "127.0.0.1:7687:7687"   # bolt (localhost only)
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-dzinza-dev-password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-dzinza-dev-password}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DZINZA_DEV=${DZINZA_DEV:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:3000:8000"   # app (localhost only)
    volumes:
      - dzinza-media:/app/media

volumes:
  neo4j-data:
  dzinza-media:
