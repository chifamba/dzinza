---
name: Dzinza CI/CD

on:
  push:
    branches: [main, develop, develop-golang]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  GO_VERSION: "1.24"
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────
  # Stage 1: Validate & Discover
  # ─────────────────────────────────────────────
  validate:
    name: Validate & Discover
    runs-on: ubuntu-latest
    outputs:
      go_services_json: ${{ steps.discover.outputs.go_services_json }}
      has_go_services: ${{ steps.discover.outputs.has_go_services }}
      has_frontend: ${{ steps.discover.outputs.has_frontend }}
      all_services_json: ${{ steps.discover.outputs.all_services_json }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover services
        id: discover
        run: |
          ALL_SERVICES_JSON="[]"
          GO_SERVICES_JSON="[]"
          HAS_GO_SERVICES=false
          HAS_FRONTEND=false

          # Check for frontend
          if [ -f "frontend/package.json" ]; then
            HAS_FRONTEND=true
            echo "📦 Found frontend (Node.js/React)"
            ALL_SERVICES_JSON=$(echo "$ALL_SERVICES_JSON" | jq --argjson item '{"name":"frontend","type":"node"}' '. + [$item]')
          fi

          # Discover Go services under services/
          if [ -d "services" ]; then
            for dir in services/*/; do
              if [ -f "${dir}go.mod" ]; then
                SERVICE_NAME=$(basename "$dir")
                HAS_GO_SERVICES=true
                echo "🔷 Found Go service: $SERVICE_NAME"

                HAS_TESTS=false
                if [ -d "${dir}tests" ] || find "$dir" -name "*_test.go" -print -quit 2>/dev/null | grep -q .; then
                  HAS_TESTS=true
                fi

                SERVICE_INFO=$(jq -n \
                  --arg name "$SERVICE_NAME" \
                  --arg type "go" \
                  --argjson has_tests "$HAS_TESTS" \
                  '{name: $name, type: $type, has_tests: $has_tests}')
                GO_SERVICES_JSON=$(echo "$GO_SERVICES_JSON" | jq --argjson item "$SERVICE_INFO" '. + [$item]')
                ALL_SERVICES_JSON=$(echo "$ALL_SERVICES_JSON" | jq --argjson item "$SERVICE_INFO" '. + [$item]')
              fi
            done
          fi

          echo "go_services_json=$(echo "$GO_SERVICES_JSON" | jq -c .)" >> $GITHUB_OUTPUT
          echo "has_go_services=$HAS_GO_SERVICES" >> $GITHUB_OUTPUT
          echo "has_frontend=$HAS_FRONTEND" >> $GITHUB_OUTPUT
          echo "all_services_json=$(echo "$ALL_SERVICES_JSON" | jq -c .)" >> $GITHUB_OUTPUT

          echo ""
          echo "══════════════════════════════════════"
          echo "📋 Discovery Summary"
          echo "══════════════════════════════════════"
          echo "� Go services:  $(echo "$GO_SERVICES_JSON" | jq -c .)"
          echo "📦 Frontend:     $HAS_FRONTEND"
          echo "📋 All services: $(echo "$ALL_SERVICES_JSON" | jq -c .)"

  # ─────────────────────────────────────────────
  # Stage 2a: Go — Lint
  # ─────────────────────────────────────────────
  lint-go:
    name: Lint Go Services
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_go_services == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.validate.outputs.go_services_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service.name }}/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/${{ matrix.service.name }}
          args: --timeout=5m

  # ─────────────────────────────────────────────
  # Stage 2b: Go — Test
  # ─────────────────────────────────────────────
  test-go:
    name: Test Go Services
    runs-on: ubuntu-latest
    needs: [validate, lint-go]
    if: needs.validate.outputs.has_go_services == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.validate.outputs.go_services_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service.name }}/go.sum

      - name: Run unit tests
        working-directory: services/${{ matrix.service.name }}
        run: |
          go test ./... -race -cover -coverprofile=coverage.out -covermode=atomic -v

      - name: Check coverage threshold
        working-directory: services/${{ matrix.service.name }}
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
            echo "📊 Coverage for ${{ matrix.service.name }}: ${COVERAGE}%"
            # Warn if coverage is below 70% (adjust threshold as needed)
            if (( $(echo "$COVERAGE < 70.0" | bc -l) )); then
              echo "::warning::Coverage for ${{ matrix.service.name }} is ${COVERAGE}%, below 70% threshold"
            fi
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: services/${{ matrix.service.name }}/coverage.out
          retention-days: 7

  # ─────────────────────────────────────────────
  # Stage 2c: Go — Build
  # ─────────────────────────────────────────────
  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_go_services == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.validate.outputs.go_services_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service.name }}/go.sum

      - name: Verify dependencies
        working-directory: services/${{ matrix.service.name }}
        run: |
          go mod verify
          go mod tidy -diff

      - name: Build
        working-directory: services/${{ matrix.service.name }}
        run: go build ./...

      - name: Vet
        working-directory: services/${{ matrix.service.name }}
        run: go vet ./...

  # ─────────────────────────────────────────────
  # Stage 2d: Frontend — Build & Quality
  # ─────────────────────────────────────────────
  build-node:
    name: Build & Quality (Frontend)
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Type check
        run: npm run typecheck --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Run tests
        run: npm test --prefix frontend
        continue-on-error: true

      - name: Security audit
        run: npm audit --audit-level=high --prefix frontend
        continue-on-error: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-artifact
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # Stage 3: Docker Build & Push (main only)
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [validate, build-go, test-go, build-node]
    if: github.ref == 'refs/heads/main' && !failure()
    strategy:
      matrix:
        service_info: ${{ fromJson(needs.validate.outputs.all_services_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile for ${{ matrix.service_info.name }}
        run: |
          # Check service-specific Dockerfile locations
          if [ "${{ matrix.service_info.type }}" == "go" ]; then
            DOCKERFILE_PATH="services/${{ matrix.service_info.name }}/Dockerfile"
          else
            DOCKERFILE_PATH="${{ matrix.service_info.name }}/Dockerfile"
          fi

          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "::warning::Missing Dockerfile at $DOCKERFILE_PATH for ${{ matrix.service_info.name }}"
            exit 0  # Don't fail — service may not be containerized yet
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build context
        id: ctx
        run: |
          if [ "${{ matrix.service_info.type }}" == "go" ]; then
            echo "context=./services/${{ matrix.service_info.name }}" >> $GITHUB_OUTPUT
          else
            echo "context=./${{ matrix.service_info.name }}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service_info.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push ${{ matrix.service_info.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service_info.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service_info.name }}

  # ─────────────────────────────────────────────
  # Stage 4: Deploy Readiness Check (main only)
  # ─────────────────────────────────────────────
  deploy-ready:
    name: Deploy Ready
    runs-on: ubuntu-latest
    needs: [build-go, test-go, lint-go, build-node, docker]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Check status
        run: |
          FAILED=false

          check_result() {
            local name="$1"
            local result="$2"
            if [ "$result" == "failure" ]; then
              echo "::error::$name failed"
              FAILED=true
            elif [ "$result" == "skipped" ]; then
              echo "⏭️  $name was skipped"
            else
              echo "✅ $name passed"
            fi
          }

          check_result "Go Build"    "${{ needs.build-go.result }}"
          check_result "Go Tests"    "${{ needs.test-go.result }}"
          check_result "Go Lint"     "${{ needs.lint-go.result }}"
          check_result "Frontend"    "${{ needs.build-node.result }}"
          check_result "Docker"      "${{ needs.docker.result }}"

          if [ "$FAILED" == "true" ]; then
            echo ""
            echo "❌ Deployment blocked — one or more checks failed"
            exit 1
          fi

          echo ""
          echo "✅ All checks passed — ready for deployment!"
